<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather SMS Service - Registrierung</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="container">
        <h1>Weather SMS Service</h1>
        <p class="register-info">Erstelle ein Konto, um deine SMS Benachrichtigungen zu planen.</p>

        <form action="/api/register" method="POST">
            <div class="form-group">
                <label for="username">Benutzername</label>
                <input type="text" id="username" name="username" required placeholder="Dein Wunschname">
            </div>
            <div class="form-group">
                <label for="email">E-Mail</label>
                <input type="email" id="email" name="email" required placeholder="wandervogel@beispiel.de">
            </div>
            <div class="form-group">
                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" required placeholder="********">
            </div>
            <div class="form-group">
                <label for="password_confirm">Passwort bestätigen</label>
                <input type="password" id="password_confirm" name="password_confirm" required placeholder="********">
            </div>
            <button type="submit">Konto erstellen</button>
        </form>

        <div class="switch-link">
            <p>Bereits registriert? <a href="/">Hier einloggen</a></p>
        </div>
    </div>
</body>
</html>
